name: Build Dictionary App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # Publish job will need to upload a release, so grant token write perms
  # (job-level permissions are allowed, but we also set at workflow root here)

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build Windows EXE
      run: python build_exe.py
    
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cambridge-Dictionary-Windows
        path: dist/EnglishVietnameseDictionary.exe

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build macOS APP
      run: |
        pyinstaller --name="Cambridge Dictionary" \
                    --onefile \
                    --windowed \
                    --add-data="common_words.txt:." \
                    --hidden-import=pyttsx3.drivers \
                    --hidden-import=pyttsx3.drivers.nsss \
                    dictionary_gui.py
    
    - name: Create DMG (optional)
      run: |
        # Tạo folder để đóng gói
        mkdir -p dist/dmg
        # Đợi một chút để filesystem sync
        sleep 2
        cp -r "dist/Cambridge Dictionary.app" dist/dmg/
        # Tạo symbolic link đến Applications
        ln -s /Applications dist/dmg/Applications
        # Đợi trước khi tạo DMG
        sleep 1
        # Tạo DMG với filesystem APFS
        hdiutil create -volname "Cambridge Dictionary" -srcfolder dist/dmg -ov -format UDZO -fs APFS dist/Cambridge-Dictionary.dmg || \
        hdiutil create -volname "Cambridge Dictionary" -srcfolder dist/dmg -ov -format UDBZ dist/Cambridge-Dictionary.dmg
    
    - name: Upload macOS APP
      uses: actions/upload-artifact@v4
      with:
        name: Cambridge-Dictionary-macOS-APP
        path: dist/Cambridge Dictionary.app
    
    - name: Upload macOS DMG
      uses: actions/upload-artifact@v4
      with:
        name: Cambridge-Dictionary-macOS-DMG
        path: dist/Cambridge-Dictionary.dmg

  publish-release:
    name: Publish Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow creating/updating releases

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Cambridge-Dictionary-Windows
          path: release_assets/windows

      - name: Download macOS APP artifact
        uses: actions/download-artifact@v4
        with:
          name: Cambridge-Dictionary-macOS-APP
          path: release_assets/macos_app

      - name: Download macOS DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: Cambridge-Dictionary-macOS-DMG
          path: release_assets/macos_dmg

      - name: List assets
        run: |
          ls -R release_assets || true

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Cambridge Dictionary v${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            release_assets/windows/EnglishVietnameseDictionary.exe
            release_assets/macos_dmg/Cambridge-Dictionary.dmg
            release_assets/macos_app/**

